# Server Config
server.port=8080

# Spring Application Name
spring.application.name=lostfound-backend

# Database Configuration (Default H2 in-memory for instant local execution, overridable by MySQL env vars)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:lost_found_web;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Enable H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

# Multipart File Upload (Max 10MB for item images)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Secret & Expiration (24 hours)
jwt.secret=CollegeLostAndFoundManagementSystemSecretKeyForJWTAuth2026SecureStringWith256BitsLength
jwt.expiration=86400000
